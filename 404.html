<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <title>404 — Page not found</title>
  <meta name="description" content="The page you are looking for does not exist.">
  <!-- Root-absolute paths: GitHub Pages serves this file from any missing URL -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/manga.css">
</head>
<body>
  <main class="page" style="display:grid;align-content:center">
    <section class="pg-hero" aria-label="Error 404">
      <h1 class="big404" aria-label="404">404</h1>
    </section>
    <div class="pg-row">
      <div class="bubble"><span>This page got lost in the <b>clouds.</b><br>Maybe the link is old, or mistyped.</span></div>
      <div class="pg-dark">
        <p class="role">Page not found</p>
        <p>Nothing lives at this address. The story, the projects and the contact page are all on the home page.</p>
        <a class="btn" href="/">Back to the start</a>
      </div>
    </div>
  </main>
</body>
</html>
